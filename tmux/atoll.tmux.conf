# =============================================================================
# atoll.tmux.conf  —  teal status bar to match the atoll Vim colorscheme
# =============================================================================
# Replaces the catppuccin plugin. Colors are set directly, no plugin needed.
#
# HOW TO USE
#   1. In your ~/.tmux.conf, DELETE the catppuccin lines:
#          set -g @plugin 'catppuccin/tmux#v2.3.0'
#      (and any other `set -g @catppuccin_*` lines if you added them)
#   2. Either paste the block below into ~/.tmux.conf, OR save this file and
#      source it:   source-file ~/.config/tmux/atoll.tmux.conf
#   3. Reload:  prefix + r   (you already bind r to source ~/.tmux.conf)
#   4. Optional: remove the catppuccin plugin folder:
#          rm -rf ~/.tmux/plugins/tmux  (only the catppuccin dir if separate)
#
# Truecolor is assumed — your `terminal-overrides ",xterm*:Tc"` already sets it.
# -----------------------------------------------------------------------------

# Palette (for reference)
#   bg       #0f1716   bg_alt   #16201f   hl    #1b2826
#   fg       #cbd8d5   fg_dim   #8aa39e   faint #5f7370
#   teal     #318787   teal_brt #56c1b4   key   #3f9e9e
#   green    #9cc882   orange   #e0a87e   coral #e0867d   yellow #d8c27a

# ---- Status bar base --------------------------------------------------------
set -g status on
set -g status-position bottom
set -g status-justify left
set -g status-interval 5
set -g status-style "bg=#0f1716,fg=#8aa39e"

# ---- Left: session name (teal pill) ----------------------------------------
set -g status-left-length 40
set -g status-left "#[fg=#0f1716,bg=#318787,bold] #S #[fg=#318787,bg=#0f1716,nobold] "

# ---- Right: date / time / host ---------------------------------------------
set -g status-right-length 80
set -g status-right "#[fg=#5f7370]%Y-%m-%d #[fg=#3f9e9e]%H:%M #[fg=#0f1716,bg=#318787,bold] #h "

# ---- Windows ----------------------------------------------------------------
# inactive windows: dim, recede
set -g window-status-format "#[fg=#708b87] #I #W "
set -g window-status-style "bg=#0f1716"
# active window: bright teal pill
set -g window-status-current-format "#[fg=#0f1716,bg=#56c1b4,bold] #I #W "
set -g window-status-separator ""
# windows with activity / bell
set -g window-status-activity-style "fg=#d8c27a,bg=#0f1716"
set -g window-status-bell-style "fg=#e0867d,bg=#0f1716"

# ---- Panes ------------------------------------------------------------------
set -g pane-border-style "fg=#1b2826"
set -g pane-active-border-style "fg=#318787"

# ---- Command line / messages ------------------------------------------------
set -g message-style "bg=#318787,fg=#0f1716"
set -g message-command-style "bg=#16201f,fg=#cbd8d5"

# ---- Copy-mode selection ----------------------------------------------------
set -g mode-style "bg=#264039,fg=#cbd8d5"

# ---- Clock (prefix + t) -----------------------------------------------------
set -g clock-mode-colour "#318787"
set -g clock-mode-style 24

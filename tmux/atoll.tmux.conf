# =============================================================================
# atoll.tmux.conf  —  teal status bar to match the Atoll color palette
# =============================================================================
# Replaces the catppuccin plugin — no plugin needed; colors are set directly.
# Palette source of truth: codex/branding/Atoll Palette.md (Cortex).
#
# HOW TO USE
#   1. In ~/.tmux.conf remove the catppuccin plugin line(s):
#          set -g @plugin 'catppuccin/tmux#v2.3.0'   (+ any @catppuccin_* lines)
#   2. Either paste everything below into ~/.tmux.conf, OR source this file:
#          source-file ~/.config/tmux/atoll.tmux.conf
#      (The t_* vars are defined and used within this file, so sourcing works.)
#   3. Reload:  prefix + r
#
# Truecolor is assumed — your terminal-overrides (RGB / Tc) already sets it.
# -----------------------------------------------------------------------------

# Atoll palette — source of truth: codex/branding/Atoll Palette.md (Cortex)
# --- Backgrounds ---
t_bg="#0f1716"        # Background
t_bg_alt="#16201f"    # Cursorline / popups
t_sel="#264039"       # Selection
t_hl="#1b2826"        # Subtle highlight
# --- Text ---
t_fg="#cbd8d5"        # Default text
t_fg_dim="#8aa39e"    # Operators / punctuation
t_faint="#5f7370"     # Line numbers / faint
t_comment="#708b87"   # Comments
# --- Accents ---
t_teal="#318787"      # Teal · signature
t_keyword="#3f9e9e"   # Keyword
t_function="#56c1b4"  # Function
t_string="#9cc882"    # String
t_number="#e0a87e"    # Number
t_error="#e0867d"     # Error · red
t_warning="#d8c27a"   # Warning

# ---- Status bar base --------------------------------------------------------
set -g status on
set -g status-position bottom
set -g status-justify left
set -g status-left-length 100
set -g status-right-length 150
set -g status-interval 5
set -g status-style "bg=${t_bg},fg=${t_fg_dim}"

# ---- Left: empty (session shown on the right) ------------------------------
set -g status-left ""

# ---- Right: date · time · host · window · prefix indicator · session pill --
set -g status-right "#[fg=${t_faint},bg=${t_bg}] %Y-%m-%d #[fg=${t_keyword},bg=${t_bg}]%H:%M #[fg=${t_function},bg=${t_bg}]#h #[fg=${t_teal},bg=${t_bg},nobold,nounderscore,noitalics]#[fg=${t_bg},bg=${t_teal},nobold,nounderscore,noitalics] #[fg=${t_fg},bg=${t_sel}] #W #{?client_prefix,#[fg=${t_warning}],#[fg=${t_function}]}#[bg=${t_sel}]#{?client_prefix,#[bg=${t_warning}],#[bg=${t_function}]}#[fg=${t_bg}] #[fg=${t_fg},bg=${t_sel}] #S "

# ---- Windows ----------------------------------------------------------------
# inactive windows: index in teal, name dimmed
set -g window-status-format "#[fg=${t_teal},bg=${t_bg}] #I: #[fg=${t_fg_dim},bg=${t_bg}]#W"
set -g window-status-style "bg=${t_bg}"
# active window: bright-teal index, green check, current path (last 2 dirs)
set -g window-status-current-format "#[fg=${t_function},bg=${t_bg}] #I: #[fg=${t_string},bg=${t_bg}](✓) #[fg=${t_fg_dim},bg=${t_bg}]#(echo '#{pane_current_path}' | rev | cut -d'/' -f-2 | rev) #[fg=${t_teal},bg=${t_bg}]"
set -g window-status-separator ""
# windows with activity / bell
set -g window-status-activity-style "fg=${t_warning},bg=${t_bg}"
set -g window-status-bell-style "fg=${t_error},bg=${t_bg}"

# ---- Panes ------------------------------------------------------------------
set -g pane-border-indicators arrows
set -g pane-border-style "fg=${t_hl}"
set -g pane-active-border-style "fg=${t_teal}"

# ---- Command line / messages ------------------------------------------------
set -g message-style "bg=${t_teal},fg=${t_bg}"
set -g message-command-style "bg=${t_bg_alt},fg=${t_fg}"

# ---- Copy-mode selection ----------------------------------------------------
set -g mode-style "fg=${t_fg},bg=${t_sel},bold"

# ---- Clock (prefix + t) -----------------------------------------------------
set -g clock-mode-colour "${t_teal}"
set -g clock-mode-style 24
